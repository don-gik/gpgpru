[workspace]
members = [
    "crates/*",
]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.3.5"
license = "AGPL-3.0-or-later"
# repository = "https://github.com/don-gik/gpgpru"

[workspace.dependencies]
bytemuck = "1.25.2"

gpgpru_core = { path = "crates/gpgpru_core", version = "0.3.5" }
gpgpru_macro = { path = "crates/gpgpru_macro", version = "0.3.5" }

[profile.dev]
incremental = true
opt-level = 0

[profile.dev.package."*"]
opt-level = 2

[profile.samply]
inherits = "release"
debug = true
