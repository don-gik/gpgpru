[workspace]
members = [
    "crates/*",
]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
ash = "0.38.0"
syn = { version = "3.0.3", features = ["full", "extra-traits", "visit"] }
quote = "1.0.47"
proc-macro2 = "1.0.107"

[profile.dev]
incremental = true
opt-level = 0

[profile.dev.package."*"]
opt-level = 2
