name: Publish
on:
  push:
    tags:
      - v[0-9]+.[0-9]+.[0-9]+

jobs:
  Publish:
    runs-on: ubuntu-latest
    # container:
    #   image: rust:latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install Vulkan SDK and SPIRV-Tools
        uses: humbletim/setup-vulkan-sdk@v1.2.1
        with:
          vulkan-query-version: 1.4.304.1
          vulkan-components: Vulkan-Headers, Vulkan-Loader, SPIRV-Tools
          vulkan-use-cache: true
      - name: Publish
        run: cargo publish --workspace
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_API_KEY }}
          CPATH: "${{ env.VULKAN_SDK }}/include"
          LIBRARY_PATH: "${{ env.VULKAN_SDK }}/lib"
          CMAKE_PREFIX_PATH: "${{ env.VULKAN_SDK }}"
