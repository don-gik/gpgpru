name: Publish
on:
  push:
    tags:
      - v[0-9]+.[0-9]+.[0-9]+

jobs:
  Publish:
    runs-on: ubuntu-latest
    # container:
    #   image: rust:latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install SPIRV-Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y spirv-tools spirv-tools-dev spirv-headers libvulkan-dev
      - name: Publish
        run: cargo publish --workspace
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_API_KEY }}
          CMAKE_PREFIX_PATH: "/usr/lib/x86_64-linux-gnu/cmake/SPIRV-Tools:/usr/lib/x86_64-linux-gnu"
          CPATH: "/usr/include"
          LIBRARY_PATH: "/usr/lib/x86_64-linux-gnu"
