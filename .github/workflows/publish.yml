name: Publish
on:
  push:
    tags:
      - v[0-9]+.[0-9]+.[0-9]+

jobs:
  Publish:
    runs-on: ubuntu-latest
    # container:
    #   image: rust:latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install toml-cli
        run: cargo install toml-cli
      - name: Check version
        run: |
            main_lib_toml="crates/gpgpru/Cargo.toml"
            toml_version="v$(toml get -r "$main_lib_toml" package.version)"
            
            if [ "$toml_version" != "${{ github.ref_name }}" ]; then
            echo "Error: Main library version ($toml_version) does not match git tag (${{ github.ref_name }})"
            exit 1
            fi
      - name: Publish
        run: cargo publish -p gpgpru
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_API_TOKEN }}
