[package]
name = "gpgpru_core"
edition.workspace = true
version.workspace = true
description = "Core lib for gpgpru"
license.workspace = true
readme.workspace = true

[lib]
doctest = false

[dependencies]
ash = "0.38.0"
crossbeam-queue = "0.3.13"
dashmap = "6.2.1"
gpu-allocator = { version = "0.28.0", features = ["vulkan"] }
parking_lot = "0.12.5"
smallvec = "1.16.1"
thiserror = "2.0.20"
tracing = "0.1.44"
