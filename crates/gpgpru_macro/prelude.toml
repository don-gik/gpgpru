# prelude.toml

[swizzles]
xyzw = ["x", "y", "z", "w"]
rgba = ["r", "g", "b", "a"]

[functions]
"Vec2::new"   = ["Vec2", "float2"]
"Vec3::new"   = ["Vec3", "float3"]
"Vec4::new"   = ["Vec4", "float4"]
"Vec2::splat" = ["Vec2", "float2"]
"Vec3::splat" = ["Vec3", "float3"]
"Vec4::splat" = ["Vec4", "float4"]

[math.returns_scalar]
"dot"      = "dot"
"length"   = "length"
"distance" = "distance"

[math.returns_same]
"normalize" = "normalize"
"clamp"     = "clamp"
"f32::max"  = "max"

[methods.to_function.returns_scalar]
"dot" = "dot"
"length" = "length"

[methods.to_function.returns_same]
"normalize" = "normalize"

[methods.keep_method.returns_explicit]
"sample" = ["Vec4", "Sample"]
"load"   = ["Vec4", "Load"]
