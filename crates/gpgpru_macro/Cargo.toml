[package]
name = "gpgpru_macro"
edition.workspace = true
version.workspace = true
description = "Macros for gpgpru"
license.workspace = true
readme.workspace = true

[lib]
proc-macro = true

[dependencies]
syn = { version = "3.0.3", features = ["full", "extra-traits", "visit", "visit-mut"] }
quote = "1.0.47"
proc-macro2 = "1.0.107"
serde_json = "1.0.154"
thiserror = "2.0.21"
rustc-hash = "2.1.3"
camino = { version = "1.2.6", features = ["serde1"] }
serde = { version = "1.0.229", features = ["derive"] }

[build-dependencies]
cmake = "0.1"
